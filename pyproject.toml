[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tcc-research-os"
version = "0.2.0"
description = "Pipeline auditável e reutilizável para revisões de literatura acadêmica"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["systematic-review", "literature-review", "research", "fastapi", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
tcc-screen = "tcc_research_os.cli_screen:main"
tcc-rerank = "tcc_research_os.cli_rerank:main"
tcc-llm-screen = "tcc_research_os.cli_llm_screen:main"
tcc-fulltext-screen = "tcc_research_os.cli_fulltext_screen:main"
tcc-quality-report = "tcc_research_os.cli_quality_report:main"
tcc-import-pdf = "tcc_research_os.cli_import_pdf:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc_research_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
